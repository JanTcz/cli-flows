name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: npm ci
      - run: npm run check
      - name: The package builds, and the built command runs
        run: npm run build && node dist/bin/flows.js --help
      - name: The pinned engine is fetched and checked, and the contract holds against it
        run: node bin/flows.ts setup && npm run contract
